name: Verify INTERLIS ili2db plugin

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-verify.yml@main
    with:
      ci-ref: main
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "macos-15", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-working-directory: .
      maven-options: -U -B -ntp
      maven-goals: clean verify
      compatibility-goals: clean test
      pom-file: pom.xml
      zip-descriptors: >-
        [{"artifactId":"hop-action-ili2db","zipGlob":"assemblies/assemblies-action-ili2db/target/hop-action-ili2db-*.zip","pluginRoot":"plugins/actions/ili2db"},
         {"artifactId":"hop-transform-ili2db","zipGlob":"assemblies/assemblies-transform-ili2db/target/hop-transform-ili2db-*.zip","pluginRoot":"plugins/transforms/ili2db"}]
      validation-commands: '["python3 scripts/verify-packages.py", "python3 scripts/run-e2e.py"]'
      artifact-name-prefix: hop-ili2db-plugin
      group-id: ch.so.agi
      hop-version: 2.19.0
    secrets: inherit
